name: Android CI with Build Lint Test

on:
  push:
    branches:
      - "main"
      - "develop"
      - "Release/*"
  pull_request:
    branches:
      - "main"
      - "develop"
      - "Release/*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install Android SDK, Emulator & system image
        run: |
          yes | sdkmanager --licenses
          yes | sdkmanager --update
          yes | sdkmanager \
            "platform-tools" \
            "emulator" \
            "system-images;android-34;google_apis;x86_64"

      - name: Create AVD
        run: |
          echo "no" | avdmanager create avd \
            --force \
            -n pixel_6_api_34 \
            -k "system-images;android-34;google_apis;x86_64" \
            --device "pixel"

      - name: Start Emulator (headless)
        run: |
          nohup emulator -avd pixel_6_api_34 \
            -no-window \
            -no-audio \
            -no-boot-anim > /dev/null 2>&1 &
          adb wait-for-device

      - name: Wait for emulator to boot
        run: |
          timeout=0
          until adb shell getprop sys.boot_completed | grep -m 1 '1'; do
            sleep 5
            timeout=$((timeout + 5))
            if [ $timeout -gt 300 ]; then
              echo "Emulator failed to boot in 5 minutes" && exit 1
            fi
          done

      - name: Load Google Service file
        env:
          DATA: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo $DATA | base64 -di > app/google-services.json

      - name: Create local.properties
        env:
          LOCAL_PROPERTIES_CONTENTS: ${{ secrets.LOCAL_PROPERTIES_CONTENTS }}
        run: echo "${LOCAL_PROPERTIES_CONTENTS}" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Execute unit tests
        run: ./gradlew test

      - name: Execute instrumentation tests on Pixel 6 API 34
        run: |
          ./gradlew pixel6Api34Setup \
                     pixel6Api34AndroidTest \
                     pixel6Api34Shutdown

      - name: Execute ktlintCheck
        run: ./gradlew ktlintCheck
